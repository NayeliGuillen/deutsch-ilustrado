<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Deutsch Ilustrado">
  <defs>
    <linearGradient id="bandera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset=".333" stop-color="#1a1a1a"/>
      <stop offset=".333" stop-color="#dd0000"/>
      <stop offset=".666" stop-color="#dd0000"/>
      <stop offset=".666" stop-color="#ffce00"/>
      <stop offset="1" stop-color="#ffce00"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" rx="96" fill="#1f2430"/>

  <!-- Disco con los colores de la bandera -->
  <circle cx="256" cy="212" r="112" fill="url(#bandera)"/>
  <circle cx="256" cy="212" r="112" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="6"/>

  <!-- Marca tipográfica -->
  <text x="256" y="420" text-anchor="middle"
        font-family="Trebuchet MS, Segoe UI, sans-serif"
        font-size="104" font-weight="bold" fill="#f5f3ef" letter-spacing="4">De</text>
</svg>
